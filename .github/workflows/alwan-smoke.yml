name: Clean APK independent runtime smoke
on:
  push:
    branches: [alwan-clean-nuvio]
    paths: ['.github/workflows/alwan-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AlwanCinema-clean-0.5.9
          run-id: 38158967056
          github-token: ${{ github.token }}
          path: artifact
      - name: Prepare smoke script
        run: |
          cat > smoke.sh <<'SH'
          set -eu
          adb logcat -c
          adb logcat -v threadtime > runtime-log.txt 2>&1 &
          logger=$!
          trap 'kill "$logger" || true' EXIT
          apk=$(find artifact -name '*full-x86_64-debug.apk' -print -quit)
          testapk=$(find artifact -name '*debug-androidTest.apk' -print -quit)
          release=$(find artifact -name '*full-x86_64-release.apk' -print -quit)
          adb install "$apk"
          adb install "$testapk"
          adb shell appops set com.nuvio.cinemana MANAGE_EXTERNAL_STORAGE allow
          adb shell am instrument -w -e class com.nuvio.android.AlwanCleanIntegrationTest -e stage prepare com.nuvio.cinemana.test/androidx.test.runner.AndroidJUnitRunner | tee prepare-test.txt
          grep -q 'OK (1 test)' prepare-test.txt
          adb shell am force-stop com.nuvio.cinemana
          adb uninstall com.nuvio.cinemana
          adb install "$apk"
          adb shell appops set com.nuvio.cinemana MANAGE_EXTERNAL_STORAGE allow
          adb shell am instrument -w -e class com.nuvio.android.AlwanCleanIntegrationTest -e stage verify com.nuvio.cinemana.test/androidx.test.runner.AndroidJUnitRunner | tee restore-test.txt
          grep -q 'OK (1 test)' restore-test.txt
          adb uninstall com.nuvio.cinemana
          adb install "$release"
          adb shell appops set com.nuvio.cinemana MANAGE_EXTERNAL_STORAGE allow
          adb logcat -c
          adb shell am start -W -n com.nuvio.cinemana/com.nuvio.app.launcher.AppIconDefault | tee release-launch.txt
          sleep 15
          adb shell pidof com.nuvio.cinemana
          adb logcat -d -b crash > crash-log.txt
          if grep -q 'FATAL EXCEPTION' crash-log.txt; then cat crash-log.txt; exit 1; fi
          echo 'Optimized release stayed running; real uninstall/restore passed.'
          SH
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus One
          ram-size: 1024M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash smoke.sh
      - name: Capture host diagnostics
        if: always()
        run: sudo dmesg | tail -100 > host-kernel.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alwan-clean-runtime-diagnostics
          path: |
            runtime-log.txt
            crash-log.txt
            host-kernel.txt
            *-test.txt
            release-launch.txt
