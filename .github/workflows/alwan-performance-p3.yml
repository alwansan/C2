name: AlwanCinema Performance P3 arm64 APK
on:
  push:
    branches: [alwan-clean-nuvio]
    paths:
      - 'nuvio-mods/performance_p3.patch.gz.b64'
      - 'nuvio-mods/apply_performance_p3.py'
      - '.github/workflows/alwan-performance-p3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned clean Nuvio
        run: |
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioMobile.git nuvio
          git -C nuvio checkout db0c50b503039863909c86405907462bf1752193
      - name: Apply base mods plus reviewed P3 performance fixes
        run: |
          python nuvio-mods/install.py nuvio
          python nuvio-mods/apply_performance_p3.py nuvio
      - name: Check official account backend inputs without showing credentials
        shell: bash
        run: |
          if [[ -n "$NUVIO_SUPABASE_URL" && -n "$NUVIO_SUPABASE_ANON_KEY" ]]; then
            echo 'Official account configuration provided.'
            ./nuvio/gradlew -p nuvio :composeApp:verifyAlwanAccountBackend -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore
          else
            echo 'WARNING: No authorized Nuvio backend configured. Cloud account and avatar catalog will not work in this artifact.' | tee ACCOUNT_CONFIGURATION_WARNING.txt
            echo '::warning::Account/avatar server configuration missing. Provide NUVIO_SUPABASE_URL and NUVIO_SUPABASE_ANON_KEY as GitHub Actions secrets.'
          fi
      - name: Run Cinemana add-on tests
        run: |
          node --test test/*.test.js
      - name: Build arm64 optimized Android release (test-signed)
        working-directory: nuvio
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Palwan.testSigning=true --stacktrace --no-daemon
      - name: Verify generated APK
        shell: bash
        run: |
          ls -lh nuvio/androidApp/build/outputs/apk/full/release/*.apk
          test -s nuvio/androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk
          sha256sum nuvio/androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlwanCinema-Performance-P3-arm64
          path: |
            nuvio/androidApp/build/outputs/apk/full/release/androidApp-full-arm64-v8a-release.apk
            nuvio/composeApp/build/reports/
            apk-sha256.txt
            ACCOUNT_CONFIGURATION_WARNING.txt
          if-no-files-found: warn