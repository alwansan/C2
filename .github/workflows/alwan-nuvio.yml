name: Alwan clean Nuvio build
on:
  push:
    branches: [alwan-clean-nuvio]
    paths: ['nuvio-mods/**', '.github/workflows/alwan-nuvio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Fetch exact clean Nuvio source
        run: |
          git clone --filter=blob:none https://github.com/NuvioMedia/NuvioMobile.git nuvio
          git -C nuvio checkout db0c50b503039863909c86405907462bf1752193
      - name: Apply reviewed source modifications
        run: python nuvio-mods/install.py nuvio
      - name: Build clean full APK
        working-directory: nuvio
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug :androidApp:assembleFullDebugAndroidTest :androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Palwan.testSigning=true --stacktrace
          ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and real uninstall/restore smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus One
          disable-animations: true
          ram-size: 1024M
          cores: 2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r nuvio/androidApp/build/outputs/apk/full/debug/androidApp-full-x86_64-debug.apk
            adb install -r nuvio/androidApp/build/outputs/apk/androidTest/full/debug/androidApp-full-debug-androidTest.apk
            adb shell appops set com.nuvio.cinemana MANAGE_EXTERNAL_STORAGE allow
            adb shell am instrument -w -e class com.nuvio.android.AlwanCleanIntegrationTest -e stage prepare com.nuvio.cinemana.test/androidx.test.runner.AndroidJUnitRunner | tee prepare-test.txt
            cat prepare-test.txt
            grep -q 'OK (1 test)' prepare-test.txt
            adb shell am force-stop com.nuvio.cinemana
            adb uninstall com.nuvio.cinemana
            adb install -r nuvio/androidApp/build/outputs/apk/full/debug/androidApp-full-x86_64-debug.apk
            adb shell appops set com.nuvio.cinemana MANAGE_EXTERNAL_STORAGE allow
            adb shell am instrument -w -e class com.nuvio.android.AlwanCleanIntegrationTest -e stage verify com.nuvio.cinemana.test/androidx.test.runner.AndroidJUnitRunner | tee restore-test.txt
            cat restore-test.txt
            grep -q 'OK (1 test)' restore-test.txt
            adb logcat -d -b crash > crash-log.txt
            adb uninstall com.nuvio.cinemana
            adb install nuvio/androidApp/build/outputs/apk/full/release/androidApp-full-x86_64-release.apk
            adb shell appops set com.nuvio.cinemana MANAGE_EXTERNAL_STORAGE allow
            adb shell am start -W -n com.nuvio.cinemana/com.nuvio.app.launcher.AppIconDefault | tee release-launch.txt
            adb shell pidof com.nuvio.cinemana
            adb logcat -d -b crash > release-crash.txt
            test ! -s release-crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlwanCinema-clean-0.5.9
          path: |
            nuvio/androidApp/build/outputs/apk/full/debug/*.apk
            nuvio/androidApp/build/outputs/apk/androidTest/full/debug/*.apk
            nuvio/androidApp/build/outputs/apk/full/release/*.apk
            nuvio/composeApp/build/reports/
            *-test.txt
            crash-log.txt
            release-*.txt
          if-no-files-found: warn
